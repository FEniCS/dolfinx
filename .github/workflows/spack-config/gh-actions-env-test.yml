spack:
  view: /opt/view
  config:
    install_tree:
      root: /opt/spack
      padded_length: 128

  concretizer:
      unify: true
      reuse: false

  packages:
    all:
      require:
      - target=x86_64_v3
    # OpenBLAS 0.3.34 built by gcc 15.2 faults in its Zen kernels: on an
    # AMD EPYC runner, high-degree hexahedral H(curl) element creation
    # jumps to address zero. Revisit when OpenBLAS is fixed for gcc 15;
    # PR #4414 records the alternatives that do not build here.
    blas:
      require:
      - netlib-lapack
    lapack:
      require:
      - netlib-lapack
    # Use the container's mesa instead of building one. mesa@25.0.5 (the
    # newest version the pinned packages_ref knows) does not compile
    # against Ubuntu 26.04's glibc -- its bundled C11 threads polyfill
    # redeclares 'once_flag'/'call_once' -- and newer mesa releases reject
    # meson options the recipe still passes ('gallium-vdpau'). The distro
    # build matches the container's glibc by construction. Keep the
    # version in step with the image named by 'container:' in ci.yml.
    mesa:
      buildable: false
      externals:
      - spec: mesa@25.1.7+osmesa+glx+opengl
        prefix: /usr

  mirrors:
    local-buildcache:
      url: oci://ghcr.io/fenics/spack-buildcache
      binary: true
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
