spack:
  view: /opt/view
  config:
    install_tree:
      root: /opt/spack
      padded_length: 128

  concretizer:
      unify: true
      reuse: false

  packages:
    all:
      require:
      - target=x86_64_v3
    # Build the BLAS kernels for the pinned target instead of dispatching
    # on the runner's CPU. With '+dynamic_dispatch' OpenBLAS selects a
    # kernel by CPUID at load time, but the kernel set compiled in is
    # bounded by the 'target=' above, so a runner newer than that target
    # can resolve to an entry that was never built. The first BLAS call
    # then jumps to a null pointer -- which is how high-degree hexahedral
    # element creation segfaulted on a varying subset of the matrix legs.
    # Every runner satisfies x86_64_v3, so a fixed kernel set is safe.
    openblas:
      require:
      - ~dynamic_dispatch
    # Use the container's mesa instead of building one. mesa@25.0.5 (the
    # newest version the pinned packages_ref knows) does not compile
    # against Ubuntu 26.04's glibc -- its bundled C11 threads polyfill
    # redeclares 'once_flag'/'call_once' -- and newer mesa releases reject
    # meson options the recipe still passes ('gallium-vdpau'). The distro
    # build matches the container's glibc by construction. Keep the
    # version in step with the image named by 'container:' in ci.yml.
    mesa:
      buildable: false
      externals:
      - spec: mesa@25.1.7+osmesa+glx+opengl
        prefix: /usr

  mirrors:
    local-buildcache:
      url: oci://ghcr.io/fenics/dolfinx-spack-buildcache
      binary: true
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
