name: Build wheels

# By default this action does not push to test or production PyPI.  The wheels
# are available as an artifact that can be downloaded and tested locally.

on:
  workflow_dispatch:
    inputs:
      dolfinx_ref:
        description: "dolfinx git ref to checkout"
        default: "main"
        type: string

      build_fenicsx_stack:
        description: "Build wheels for whole FEniCSx stack"
        default: false
        type: boolean

      basix_ref:
        description: "basix git ref to checkout"
        default: "main"
        type: string

      ufl_ref:
        description: "ufl git ref to checkout"
        default: "main"
        type: string

      ffcx_ref:
        description: "ffcx git ref to checkout"
        default: "main"
        type: string

  workflow_call:
    inputs:
      dolfinx_ref:
        description: "dolfinx git ref to checkout"
        default: "main"
        type: string

      build_fenicsx_stack:
        description: "Build wheels for entire FEniCSx stack"
        default: false
        type: boolean

      basix_ref:
        description: "basix git ref to checkout"
        default: "main"
        type: string

      ufl_ref:
        description: "ufl git ref to checkout"
        default: "main"
        type: string

      ffcx_ref:
        description: "ffcx git ref to checkout"
        default: "main"
        type: string

jobs:
  build_wheels:
    name: Build wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_build: cp312-manylinux_x86_64
          - os: ubuntu-24.04-arm
            cibw_build: cp312-manylinux_aarch64
          - os: macos-15
            cibw_build: cp312-macosx_arm64
          - os: macos-15-intel
            cibw_build: cp312-macosx_x86_64
          - os: windows-2022
            cibw_build: cp312-win_amd64

    permissions:
      packages: write

    env:
      CIBW_BUILD: ${{ matrix.cibw_build }}
      CIBW_BUILD_VERBOSITY: 1
      CIBW_ENVIRONMENT: PIP_INDEX_URL="file:///project/simple" PIP_EXTRA_INDEX_URL="https://pypi.org/simple"
      CIBW_ARCHS_LINUX: native
      CIBW_ARCHS_MACOS: native
      CIBW_ARCHS_WINDOWS: AMD64
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_34_x86_64:latest
      CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/manylinux_2_34_aarch64:latest
      # vcpkg is pre-installed on the windows-2022 runner image.
      VCPKG_EXE: C:/vcpkg/vcpkg
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/FEniCS/index.json,readwrite"

    steps:
      # Windows only: cache vcpkg-built ports (e.g. Intel MPI) in a GitHub
      # Packages NuGet feed, matching windows.yml.
      - name: Add NuGet sources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .$(${{ env.VCPKG_EXE }} fetch nuget) `
            sources add `
            -Source "https://nuget.pkg.github.com/FEniCS/index.json" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "FEniCS" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
          .$(${{ env.VCPKG_EXE }} fetch nuget) `
            setapikey "${{ secrets.GITHUB_TOKEN }}" `
            -Source "https://nuget.pkg.github.com/FEniCS/index.json"

      - name: Install Intel MPI (Windows)
        if: runner.os == 'Windows'
        uses: mpi4py/setup-mpi@v1.4.4
        with:
          mpi: "intelmpi"

      - uses: actions/setup-python@v7

      - name: Install Python dependencies
        run: python -m pip install cibuildwheel simple503 build

      - name: Checkout UFL
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: FEniCS/ufl
          path: ufl
          ref: ${{ github.event.inputs.ufl_ref }}

      - name: Build UFL wheel
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        run: |
          python -m build -o wheelhouse/ ufl/

      - name: Checkout FFCx
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: FEniCS/ffcx
          path: ffcx
          ref: ${{ github.event.inputs.ffcx_ref }}

      - name: Build FFCx wheel
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        run: |
          python -m build -o wheelhouse/ ffcx/

      - name: Checkout Basix
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: FEniCS/basix
          path: basix
          ref: ${{ github.event.inputs.basix_ref }}

      - name: Build Basix wheel
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        working-directory: basix/
        run: |
          python -m cibuildwheel --output-dir ../wheelhouse/ .

      - name: Make temporary simple503 repo directories
        shell: bash
        run: mkdir -p wheelhouse/ simple/

      - name: Add wheels to simple503 repository (if built)
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        shell: bash
        run: cp wheelhouse/* simple/

      - name: Index simple503 repository (Linux)
        if: runner.os == 'Linux'
        run: python -m simple503 --base-url file:///project/simple simple/

      - name: Index simple503 repository (macOS)
        if: runner.os == 'macOS'
        run: python -m simple503 --base-url "file://${GITHUB_WORKSPACE}/simple" simple/

      - name: Index simple503 repository (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python -m simple503 --base-url "file://${GITHUB_WORKSPACE}/simple" simple/

      - name: Checkout DOLFINx
        uses: actions/checkout@v7
        with:
          path: dolfinx
          ref: ${{ github.event.inputs.dolfinx_ref }}

      # fenics-ffcx and fenics-basix are required by DOLFINx C++ build
      # mpi4py and petsc4py are build_requirements of DOLFINx Python
      - name: Build DOLFINx wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse/ dolfinx/python
        env:
          CIBW_ENVIRONMENT_LINUX: PIP_EXTRA_INDEX_URL=file:///project/simple
          # When using Homebrew the packaged .so are always built on the macOS
          # SDK version of the current system. Consequently
          # MACOSX_DEPLOYMENT_TARGET must always be set to the SDK version of
          # the current system.
          CIBW_ENVIRONMENT_MACOS: >
            PIP_EXTRA_INDEX_URL=file://$GITHUB_WORKSPACE/simple
            MACOSX_DEPLOYMENT_TARGET=$(xcrun --sdk macosx --show-sdk-version)
            CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/dolfinx-install:$(brew --prefix)
          # CIBW_ENVIRONMENT_* is parsed by cibuildwheel itself (bashlex),
          # not the OS shell, so it's $VAR/$(...) on every platform including
          # Windows. CIBW_BEFORE_BUILD/REPAIR/TEST_COMMAND_WINDOWS below are
          # genuinely run via cmd.exe though, so those use %VAR%.
          CIBW_ENVIRONMENT_WINDOWS: >
            PIP_EXTRA_INDEX_URL=file://$GITHUB_WORKSPACE/simple
            CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/dolfinx-install
          CIBW_BEFORE_BUILD_LINUX: >
            dnf -y update &&
            dnf install -y dnf-plugins-core &&
            dnf install -y epel-release &&
            /usr/bin/crb enable &&
            dnf -y update &&
            dnf -y install git hdf5-mpich-devel make \
              mpich-devel ninja-build openblas-devel pugixml-devel spdlog-devel &&
            curl -L https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.gz | tar -xz &&
            (cd boost_1_92_0/ && ./bootstrap.sh --prefix=/usr/local &&
              ./b2 -d0 --prefix=/usr/local --with-headers install) &&
            ln -s /usr/include/mpich-$(arch) /usr/lib64/mpich/include &&
            mkdir -p scotch && curl -L https://gitlab.inria.fr/scotch/scotch/-/archive/v7.0.12/scotch-v7.0.12.tar.bz2 | tar -xj --strip-components=1 -C scotch &&
            cmake -G Ninja -S scotch/ -B scotch-build-dir/ \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_PREFIX_PATH=/usr/lib64/mpich \
              -DBUILD_LIBSCOTCHMETIS=ON \
              -DINSTALL_METIS_HEADERS=ON &&
            cmake --build scotch-build-dir/ &&
            cmake --install scotch-build-dir/ &&
            git clone --branch v9.2.1 --single-branch https://github.com/xiaoyeli/superlu_dist.git &&
            cmake -G Ninja -S superlu_dist/ -B superlu_dist-build-dir/ \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_PREFIX_PATH=/usr/lib64/mpich \
              -DTPL_ENABLE_PARMETISLIB=ON \
              -DXSDK_ENABLE_Fortran=OFF \
              -DTPL_PARMETIS_INCLUDE_DIRS=/usr/local/include \
              -DTPL_PARMETIS_LIBRARIES="-lptscotchparmetisv3 -lptscotch -lptscotcherr -lscotchmetisv5 -lscotch -lscotcherr" \
              -DCMAKE_C_FLAGS_INIT="-DSCOTCH_METIS_VERSION=5" \
              -DTPL_ENABLE_LAPACKLIB=ON &&
            cmake --build superlu_dist-build-dir/ &&
            cmake --install superlu_dist-build-dir/ &&
            echo /usr/local/lib64 > /etc/ld.so.conf.d/usr-local-lib64.conf && ldconfig &&
            pip -v install --pre fenics-basix fenics-ffcx &&
            pip -v install mpi4py scikit-build-core[pyproject] nanobind &&
            cmake -G Ninja -S dolfinx/cpp -B dolfinx-build-dir/ \
              -DPython3_EXECUTABLE=$(which python) \
              -DCMAKE_PREFIX_PATH=/usr/lib64/mpich \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DDOLFINX_ENABLE_SUPERLU_DIST=ON \
              -DDOLFINX_ENABLE_SCOTCH=ON \
              -DDOLFINX_ENABLE_PARMETIS=OFF &&
            cmake --build dolfinx-build-dir/ &&
            cmake --install dolfinx-build-dir/
          CIBW_BEFORE_BUILD_MACOS: >
            brew install boost hdf5-mpi ninja open-mpi openblas pkgconf pugixml spdlog &&
            mkdir -p scotch && curl -L https://gitlab.inria.fr/scotch/scotch/-/archive/v7.0.12/scotch-v7.0.12.tar.bz2 | tar -xj --strip-components=1 -C scotch &&
            cmake -G Ninja -S scotch/ -B scotch-build-dir/ \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH} \
              -DBUILD_LIBSCOTCHMETIS=ON \
              -DINSTALL_METIS_HEADERS=ON &&
            cmake --build scotch-build-dir/ &&
            sudo cmake --install scotch-build-dir/ &&
            git clone --branch v9.2.1 --single-branch https://github.com/xiaoyeli/superlu_dist.git &&
            cmake -G Ninja -S superlu_dist/ -B superlu_dist-build-dir/ \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH} \
              -DTPL_ENABLE_PARMETISLIB=ON \
              -DXSDK_ENABLE_Fortran=OFF \
              -DTPL_PARMETIS_INCLUDE_DIRS=/usr/local/include \
              -DTPL_PARMETIS_LIBRARIES="-lptscotchparmetisv3 -lptscotch -lptscotcherr -lscotchmetisv5 -lscotch -lscotcherr" \
              -DCMAKE_C_FLAGS_INIT="-DSCOTCH_METIS_VERSION=5" \
              -DTPL_ENABLE_LAPACKLIB=ON &&
            cmake --build superlu_dist-build-dir/ &&
            sudo cmake --install superlu_dist-build-dir/ &&
            pip -v install --pre fenics-basix fenics-ffcx &&
            pip -v install wheel mpi4py scikit-build-core[pyproject] nanobind &&
            cmake -G Ninja -S $GITHUB_WORKSPACE/dolfinx/cpp -B $GITHUB_WORKSPACE/dolfinx-build-dir/ \
              -DPython3_EXECUTABLE=$(which python) \
              -DCMAKE_CXX_FLAGS_INIT="-fexperimental-library" \
              -DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH} \
              -DDOLFINX_ENABLE_SCOTCH=ON \
              -DDOLFINX_ENABLE_PARMETIS=OFF \
              -DDOLFINX_ENABLE_SUPERLU_DIST=ON \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo &&
            cmake --build $GITHUB_WORKSPACE/dolfinx-build-dir/ &&
            sudo cmake --install dolfinx-build-dir/
          # Build DOLFINx's C++ library against vcpkg + Intel MPI, matching
          # windows.yml's proven Windows CI build. Basix (and FFCx's ufcx
          # header) are consumed via their pip wheel - whether from PyPI or
          # the local dev index - exactly as the Linux/macOS legs already
          # do, letting DOLFINx's own CMake Python-hint mechanism locate
          # Basix's CMake config inside the installed package. See
          # CIBW_REPAIR_WHEEL_COMMAND_WINDOWS below for how delvewheel finds
          # basix.dll there too.
          CIBW_BEFORE_BUILD_WINDOWS: >
            pip -v install --pre fenics-basix fenics-ffcx &&
            pip -v install mpi4py scikit-build-core[pyproject] nanobind delvewheel &&
            cmake -S dolfinx/cpp -B dolfinx-build-dir/ -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake -DVCPKG_OVERLAY_PORTS=dolfinx/cpp/cmake/vcpkg-overlay &&
            cmake --build dolfinx-build-dir/ --config Release &&
            cmake --install dolfinx-build-dir/ --config Release --prefix %GITHUB_WORKSPACE%/dolfinx-install
          # As of 6/26 DOLFINx uses std::jthread which is only officially
          # supported in macOS SDK 26. -fexperimental-library enables
          # experimental std library support which allows the build to complete
          # on macOS SDK 15.
          CIBW_CONFIG_SETTINGS_LINUX: >
            cmake.args="-DCMAKE_PREFIX_PATH=/usr/lib64/mpich"
            wheel.py-api=cp312
            cmake.build-type="Release"
          CIBW_CONFIG_SETTINGS_MACOS: >
            cmake.args="-DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH;-DCMAKE_CXX_FLAGS_INIT=-fexperimental-library"
            wheel.py-api=cp312
            cmake.build-type="Release"
          # CIBW_CONFIG_SETTINGS_* gets no variable expansion at all (only
          # {project}/{package} placeholders) - use a GH Actions expression,
          # resolved at workflow-parse time, and the vcpkg path that's fixed
          # on the windows-2022 runner image (matching windows.yml).
          CIBW_CONFIG_SETTINGS_WINDOWS: >
            cmake.args="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake;-DVCPKG_OVERLAY_PORTS=../cpp/cmake/vcpkg-overlay"
            wheel.py-api=cp312
            cmake.build-type="Release"
          CIBW_BUILD_FRONTEND: "build; args: -nx"
          # The first line allows auditwheel to find and bundle in libbasix
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            export LD_LIBRARY_PATH=$(python -c "import site; print(site.getsitepackages()[0] + '/fenics_basix.libs')"):${LD_LIBRARY_PATH} &&
            auditwheel repair --exclude libmpi.so* -w {dest_dir} {wheel} &&
            pipx run abi3audit --verbose --strict --report {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-listdeps --depending {wheel} &&
            delocate-wheel --require-archs {delocate_archs} --exclude libmpi -w {dest_dir} {wheel} &&
            wheel unpack {dest_dir}/*.whl -d {dest_dir}/unpacked &&
            rm {dest_dir}/*.whl &&
            find {dest_dir}/unpacked \( -name "*.so" -o -name "*.dylib" \) | while read -r f; do for dep in $(otool -L "$f" | awk '/libmpi\.[0-9]+\.dylib/{print $1}'); do install_name_tool -change "$dep" @rpath/$(basename "$dep") "$f"; done; done &&
            find {dest_dir}/unpacked \( -name "*.so" -o -name "*.dylib" \) | xargs -I% codesign --force --sign - % &&
            wheel pack {dest_dir}/unpacked/* -d {dest_dir} &&
            pipx run abi3audit --verbose --strict --report {wheel}
          # Phase A: bundle everything, including Intel MPI's impi.dll and
          # libfabric.dll (no --exclude yet; unbundling via impi-rt is a
          # follow-up once this fully-bundled build is proven). Basix's own
          # wheel-repair step mangles its *third-party* runtime DLLs into
          # fenics_basix.libs, but leaves basix.dll itself as a plain file
          # directly in the installed basix package directory - nowhere
          # delvewheel would otherwise look. Discover that directory via
          # Python (avoids cmd.exe variable-expansion pitfalls) and invoke
          # delvewheel with it added, rather than hardcoding a path.
          # %GITHUB_WORKSPACE% is substituted by cmd.exe as literal (possibly
          # backslash-laden) text before python ever parses this string, so
          # it and the {dest_dir}/{wheel} substitutions below are wrapped in
          # raw string literals - otherwise e.g. "D:\a\..." reads \a as a
          # (corrupting, not even erroring) Python escape sequence.
          # dolfinx-build-dir/vcpkg_installed/.../bin holds DOLFINx's other
          # vcpkg-provided runtime deps (spdlog, boost, hdf5, ...) - these
          # were never copied into dolfinx-install/bin since
          # INSTALL_RUNTIME_DEPENDENCIES was dropped above. basix.dll's own
          # third-party deps (openblas, lapack, ...) were delvewheel-mangled
          # into the sibling fenics_basix.libs directory when Basix's own
          # wheel was repaired, and basix.dll's import table was patched to
          # reference those mangled names - so that directory needs to be
          # searched too, not just the basix package directory itself.
          #
          # impi.dll/libfabric.dll are excluded rather than bundled (unlike
          # Linux/macOS's fully-bundled MPI story elsewhere in this file):
          # dolfinx.cpp and mpi4py share raw MPI_Comm handles directly
          # (caster_mpi.h), so they must resolve to the exact same loaded
          # impi.dll instance. Bundling DOLFINx's own copy would risk a
          # second, independently-loaded MPI runtime instance alongside
          # whatever mpi4py resolves (e.g. via a separately pip-installed
          # impi-rt) - not just wasted disk space, but an ABI/state mismatch
          # since MPI_Comm handles from one instance are meaningless to the
          # other. Both dolfinx.cpp and mpi4py instead rely on mpi4py's own
          # _mpi_dll_path mechanism (triggered by dolfinx/__init__.py's
          # `import mpi4py`, which runs before dolfinx.cpp is loaded) to
          # find the one impi-rt-provided copy.
          #
          # msvcp140.dll/msvcp140_atomic_wait.dll are also excluded: delvewheel
          # errored trying to mangle the same file twice (found via two
          # separate dependency chains). These MSVC redistributable DLLs are
          # near-universally already present on any modern Windows system, the
          # same assumption manylinux makes for glibc.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            python -c "import basix, os, subprocess; site_packages = os.path.dirname(os.path.dirname(basix.__file__)); paths = os.path.dirname(basix.__file__) + ';' + os.path.join(site_packages, 'fenics_basix.libs'); subprocess.run(['delvewheel', 'repair', '--exclude', 'impi.dll;libfabric.dll;msvcp140.dll;msvcp140_atomic_wait.dll', '--add-path', paths + ';' + r'%GITHUB_WORKSPACE%/dolfinx-install/bin;%GITHUB_WORKSPACE%/dolfinx-build-dir/vcpkg_installed/x64-windows/bin;C:/Program Files (x86)/Intel/oneAPI/mpi/latest/opt/mpi/libfabric/bin', '-w', r'{dest_dir}', r'{wheel}'], check=True)"
          CIBW_TEST_REQUIRES: pytest-xdist
          CIBW_TEST_GROUPS: test
          CIBW_TEST_COMMAND_LINUX: >
            . /etc/profile &&
            module load mpi/mpich-$(arch) &&
            python -m pytest -n auto -m "not adios2 and not petsc4py" {project}/dolfinx/python/test/unit &&
            mpiexec -n 2 python -m pytest -m "not adios2 and not petsc4py" {project}/dolfinx/python/test/unit
          CIBW_TEST_COMMAND_MACOS: >
            export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib${DYLD_LIBRARY_FALLBACK_PATH:+:${DYLD_LIBRARY_FALLBACK_PATH}}" &&
            mpiexec -n 1 python -m pytest -n auto -m "not adios2 and not petsc4py" {project}/dolfinx/python/test/unit &&
            mpiexec -n 2 python -m pytest -m "not adios2 and not petsc4py" {project}/dolfinx/python/test/unit
          # impi.dll is excluded from the wheel (see
          # CIBW_REPAIR_WHEEL_COMMAND_WINDOWS above), so mpiexec/impi.dll
          # must come from somewhere for both mpi4py and dolfinx.cpp -
          # impi-rt, matching mpi4py's own documented Windows install
          # instructions (pip install mpi4py impi-rt).
          CIBW_TEST_COMMAND_WINDOWS: >
            pip install impi-rt &&
            python -m pytest -n auto -m "not adios2 and not petsc4py" {project}/dolfinx/python/test/unit &&
            mpiexec -n 2 python -m pytest -m "not adios2 and not petsc4py" {project}/dolfinx/python/test/unit

      # Basix and DOLFINx wheels each independently bundle their own copy of
      # shared libraries they both depend on (e.g. libbasix/basix.dll
      # itself), auditwheel/delocate/delvewheel-mangled with different
      # names. consolidatewheels reconciles the naming across the whole
      # wheelhouse and drops the now-redundant duplicates, so DOLFINx's
      # wheel references Basix's already-bundled copy instead of shipping
      # its own. Uses shimwell's fork/branch for versioned Linux .so
      # support (e.g. libfoo.so.1.2.3), not yet in the upstream release.
      # Only meaningful when build_fenicsx_stack built a local Basix wheel
      # to consolidate against; otherwise a harmless no-op.
      - name: Consolidate wheels
        shell: bash
        run: |
          pip install "consolidatewheels @ git+https://github.com/shimwell/consolidatewheels.git@support-versioned-linux-libraries"
          consolidatewheels wheelhouse/*.whl --dest=wheelhouse-consolidated
          rm -rf wheelhouse
          mv wheelhouse-consolidated wheelhouse

      - name: Update temporary simple503 repository (Linux)
        if: runner.os == 'Linux'
        run: |
          cp wheelhouse/* simple
          python -m simple503 --base-url file:///shared simple

      - name: Update temporary simple503 repository (macOS)
        if: runner.os == 'macOS'
        run: |
          cp wheelhouse/* simple
          python -m simple503 --base-url "file://${GITHUB_WORKSPACE}/simple" simple

      - name: Update temporary simple503 repository (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp wheelhouse/* simple
          python -m simple503 --base-url "file://${GITHUB_WORKSPACE}/simple" simple

      - name: Upload simple503-test artifact
        uses: actions/upload-artifact@v7
        with:
          name: simple503-test-${{ matrix.os }}
          path: simple/*

      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheelhouse-${{ matrix.os }}
          path: wheelhouse/*

      - name: Test in clean python image with pypi MPICH
        if: runner.os == 'Linux'
        run: >
          cd dolfinx &&
          sudo git clean -fdx && cd ../ &&
          docker run -v $(pwd)/dolfinx:/dolfinx -v $(pwd)/simple:/shared \
            --env PIP_INDEX_URL=file:///shared --env PIP_EXTRA_INDEX_URL=https://pypi.org/simple python:3.13 \
            /bin/bash -l -c "pip install --group /dolfinx/python/pyproject.toml:test mpich fenics-dolfinx && mpiexec -n 2 python -m pytest -m 'not adios2 and not petsc4py' /dolfinx/python/test/unit"

      - name: Test in clean python image with pypi Intel MPI (x86_64 only)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: >
          cd dolfinx &&
          sudo git clean -fdx && cd ../ &&
          docker run -v $(pwd)/dolfinx:/dolfinx -v $(pwd)/simple:/shared \
            --env PIP_INDEX_URL=file:///shared --env PIP_EXTRA_INDEX_URL=https://pypi.org/simple python:3.14 \
            /bin/bash -l -c "pip install --group /dolfinx/python/pyproject.toml:test impi-rt fenics-dolfinx && mpiexec -n 2 python -m pytest -m 'not adios2 and not petsc4py' /dolfinx/python/test/unit"

      - name: Test in clean virtual environment with pypi OpenMPI (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dolfinx && git clean -fdx && cd ../
          python -m venv venv-test
          source venv-test/bin/activate
          PIP_EXTRA_INDEX_URL="file://${GITHUB_WORKSPACE}/simple" pip install --group dolfinx/python/pyproject.toml:test openmpi fenics-dolfinx
          which mpiexec
          mpiexec -n 2 python -m pytest -m "not adios2 and not petsc4py" dolfinx/python/test/unit

      # impi.dll is excluded from the wheel like Linux/macOS's own MPI
      # libraries, so impi-rt is installed here the same way mpich/impi-rt/
      # openmpi are above - matching mpi4py's own documented Windows install
      # instructions (pip install mpi4py impi-rt). mpiexec itself comes from
      # the Intel MPI SDK installed earlier in the job (already on PATH).
      - name: Test in clean virtual environment with pypi Intel MPI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dolfinx && git clean -fdx && cd ../
          python -m venv venv-test
          source venv-test/Scripts/activate
          python -m pip install --upgrade pip
          PIP_EXTRA_INDEX_URL="file://${GITHUB_WORKSPACE}/simple" pip install --group dolfinx/python/pyproject.toml:test impi-rt fenics-dolfinx
          python -m pytest -m "not adios2 and not petsc4py" dolfinx/python/test/unit
          mpiexec -n 2 python -m pytest -m "not adios2 and not petsc4py" dolfinx/python/test/unit

      - name: Update FEniCS Project simple503 repository
        run: |
          python -m simple503 --base-url http://packages.fenicsproject.org/simple simple

      - name: Upload simple503 artifact
        uses: actions/upload-artifact@v7
        with:
          name: simple503-${{ matrix.os }}
          path: simple/*

  combined_repository:
    name: Create combined simple503 repository
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7

      - name: Install Python dependencies
        run: python -m pip install simple503

      - name: Make shared wheel directory
        run: mkdir -p shared/

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheelhouse-*
          path: wheelhouse-artifacts/

      - name: Extract wheels into shared folder
        run: find wheelhouse-artifacts/ -name "*.whl" -exec cp {} shared/ \;

      - name: Build simple503 repository
        run: python -m simple503 --base-url http://packages.fenicsproject.org/simple-beta shared/

      - name: Upload combined repository artifact
        uses: actions/upload-artifact@v7
        with:
          name: simple503-combined
          path: shared/*
