name: Spack build cache index

on:
  workflow_call:

jobs:
  update:
    name: Update Spack build cache index
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    # Each rebuild replaces the whole index. Serialise across both workflows.
    concurrency:
      group: spack-buildcache-index
      queue: max
    steps:
      - name: Set up Spack
        uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3 # v3.0.0
        with:
          spack_ref: v1.2.2
          packages_ref: c0109598cd38b30d9af1d4fbbbbba23eb2efa828
          buildcache: false

      - name: Update build cache index
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          spack mirror add --unsigned --oci-username-variable GITHUB_USER \
            --oci-password-variable GITHUB_TOKEN local-buildcache oci://ghcr.io/fenics/spack-buildcache
          spack buildcache update-index local-buildcache
