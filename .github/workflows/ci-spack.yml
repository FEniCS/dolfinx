name: "CI (RHEL clone: gcc, oneAPI; Ubuntu: NVIDIA HPC SDK)"

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs: a new commit on a pull request makes the
# previous run's result irrelevant. Pushes to 'main' and tags are
# left to finish, since they populate caches and publish artefacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITHUB_USER: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OMPI_ALLOW_RUN_AS_ROOT: 1
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
  PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe
  PYTEST_ADDOPTS: "-W error"
  # Spack environment activation does not add the view's library
  # directories to the runtime linker search path, so packages that are
  # only present in the environment (not linked via RPATH into a
  # consuming package, e.g. mesa-glu's libGLU.so.1 for gmsh) are not
  # found at runtime without this.
  LD_LIBRARY_PATH: /opt/view/lib:/opt/view/lib64

jobs:
  ci-spack-build:
    name: AlmaLinux build and test
    runs-on: ubuntu-26.04
    container: ghcr.io/almalinux/almalinux:10
    strategy:
      # One compiler failing must not cancel the other: the legs share a
      # build cache, so a cancelled leg loses its diagnostics and its
      # pushed binaries.
      fail-fast: false
      matrix:
        compiler: ["gcc", "oneapi"]

    steps:
      - name: Install Spack requirements
        run: |
          dnf -y install file bzip2 ca-certificates git gzip patch python3 tar \
            unzip xz zstd gcc gcc-c++ gcc-gfortran

      - name: Set up Spack
        uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3 # v3.0.0
        with:
          spack_ref: v1.2.2
          # spack-packages 'develop' at 2026-10-05. Bumping re-solves the
          # graph and can invalidate cached binaries; warm the cache first.
          packages_ref: c0109598cd38b30d9af1d4fbbbbba23eb2efa828

      - name: Checkout DOLFINx
        uses: actions/checkout@v7
        with:
          path: dolfinx-src

      - name: Create Spack environment
        run: spack env create py dolfinx-src/.github/workflows/spack-config/gh-actions-rh.yml

      - name: Add dependencies to environment
        run: |
          spack -e py add mpi petsc+mpi+shared+mumps+superlu-dist+suite-sparse slepc parmetis pkgconfig \
            hdf5+mpi boost pugixml spdlog
          spack -e py add python py-nanobind py-numpy py-mpi4py py-petsc4py py-slepc4py \
            py-scikit-build-core@1+pyproject py-setuptools py-cffi
          spack -e py add py-pip cmake catch2 py-pytest py-pytest-xdist ninja
          spack -e py add py-gmsh ^gmsh~fltk~med~mmg+external ^opencascade~draw py-pyvista ^mesa~llvm \
            py-networkx py-matplotlib py-pyamg py-numba  ^llvm~clang~lldb~lld~offload~libomptarget~polly targets=x86 \
            py-scipy
          # gmsh's compiled library dlopens libGLU.so.1 and several X11
          # libraries unconditionally at runtime (its native file-chooser
          # and OpenGL-based drawing code are always built in), but the
          # gmsh Spack recipe only declares depends_on("glu"/"gl") when
          # +fltk is set. We build gmsh ~fltk, so Spack's dependency graph
          # never gets these libraries, and none of them are RPATH-linked
          # in by any package either — hence they must be added explicitly
          # here and put on LD_LIBRARY_PATH (see env above) so gmsh can
          # find them at runtime.
          spack -e py add mesa-glu libx11 libxcursor libxft libxinerama libxrender

      - if: matrix.compiler == 'oneapi'
        name: Add oneAPI compilers to environment
        run: spack -e py add intel-oneapi-compilers

      - name: Install Spack packages
        run: spack -e py install -j $(nproc) --use-buildcache auto

      - name: Push packages to Spack cache and update index
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spack debug report
          spack -d -e py buildcache push --base-image ghcr.io/almalinux/almalinux:10 --allow-missing --update-index local-buildcache
        if: ${{ !cancelled() }}

      - name: Load FEniCS testing environment variables
        run: cat dolfinx-src/.github/workflows/fenicsx-refs.env >> $GITHUB_ENV

      - name: Install FEniCS Python components
        run: |
          spack env activate py
          pip install git+https://github.com/${{ env.ufl_repository }}.git@${{ env.ufl_ref }}
          pip install git+https://github.com/${{ env.basix_repository }}.git@${{ env.basix_ref }}
          pip install git+https://github.com/${{ env.ffcx_repository }}.git@${{ env.ffcx_ref }}
          python -c "import basix, os, sys; sys.stdout.write(os.path.dirname(basix.__file__))"
        shell: spack-bash {0}

      - name: Configure and build C++
        run: |
          spack env activate py
          cmake -Werror=dev --warn-uninitialized -G Ninja -DBUILD_TESTING=true -DCMAKE_BUILD_TYPE=Developer \
            -DDOLFINX_ENABLE_PETSC=on -DDOLFINX_ENABLE_SLEPC=true \
            -DDOLFINX_ENABLE_PARMETIS=true -DDOLFINX_ENABLE_SUPERLU_DIST=true -B build -S dolfinx-src/cpp/
          cmake --build build
        shell: spack-bash {0}

      - name: Run tests without install (C++, serial and MPI np=2)
        run: |
          spack env activate py
          cd build
          ctest -V --output-on-failure -R unittests_np_1
          ctest -V --output-on-failure -R unittests_np_2
        shell: spack-bash {0}

      - name: Install C++
        run: |
          spack env activate py
          cmake --build build --target install
        shell: spack-bash {0}

      - name: Build and run C++ regression tests (serial and MPI (np=2))
        run: |
          spack env activate py
          cmake -Werror=dev --warn-uninitialized -G Ninja -DCMAKE_BUILD_TYPE=Developer -B build/demo/ -S dolfinx-src/cpp/demo/
          cmake --build build/demo
          cd build/demo
          ctest -V --output-on-failure -R "demo_.*_np_1"
          ctest -V --output-on-failure -R "demo_.*_np_2"
        shell: spack-bash {0}

      - name: Build Python interface (editable install)
        run: |
          spack env activate py
          pip install --check-build-dependencies --no-build-isolation --config-settings=cmake.build-type=Developer --config-settings=build-dir="build" -e 'dolfinx-src/python/'
        shell: spack-bash {0}

      - name: Set default DOLFINx JIT options
        run: |
          mkdir -p ~/.config/dolfinx
          echo '{ "cffi_extra_compile_args": ["-g0", "-O0" ] }' > ~/.config/dolfinx/dolfinx_jit_options.json

      - name: Run demos (Python, serial and MPI)
        run: |
          spack env activate py
          python -m pytest -n auto -m serial --durations=10 dolfinx-src/python/demo/test.py
          # demo_navier-stokes.py deadlocks at np=2 in its MUMPS direct solve
          # (singular-system ICNTLs); it passes in the serial run above.
          # Deselected by name, not node id, whose path index follows glob order.
          python -m pytest -m mpi --num-proc=2 -k "not navier-stokes" dolfinx-src/python/demo/test.py
        shell: spack-bash {0}

      - name: Run Python unit tests (serial and MPI)
        run: |
          spack env activate py
          python -m pytest -n auto -m "not adios2" --durations=50 dolfinx-src/python/test/unit/
          mpirun -np 2 python -m pytest -m "not adios2" dolfinx-src/python/test/unit/
        shell: spack-bash {0}

  # DOLFINx built with the NVIDIA HPC SDK C/C++ compilers (nvc, nvc++),
  # whose EDG-based front end rejects some code that gcc and clang accept.
  # Dependencies come from Ubuntu and are built with gcc; nvc++ uses
  # gcc's libstdc++, so they are ABI-compatible.
  nvhpc-build:
    name: Ubuntu build and test (nvhpc)
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash
    env:
      NVHPC_VERSION: "26.11"
      # Ubuntu 26.04's OpenMPI 5.0.10 can deadlock in
      # MPI_Dist_graph_create under the treematch component; see
      # docker/Dockerfile.test-env.
      OMPI_MCA_topo: basic
      # Select Ubuntu's MPI HDF5 over its serial build.
      HDF5_ROOT: /usr/lib/x86_64-linux-gnu/hdf5/openmpi
      CC: nvc
      CXX: nvc++
      CMAKE_PREFIX_PATH: /opt/basix
      LD_LIBRARY_PATH: /opt/basix/lib

    steps:
      - name: Install dependencies
        run: |
          apt-get -y update
          apt-get install -y --no-install-recommends ca-certificates catch2 cmake curl g++ git gpg \
            libblas-dev libboost-dev libhdf5-mpi-dev liblapack-dev libptscotch-dev libpugixml-dev libspdlog-dev \
            mpi-default-dev ninja-build pkg-config python3-dev python3-venv

      - name: Install NVIDIA HPC SDK
        run: |
          curl -fsSL https://developer.download.nvidia.com/hpc-sdk/ubuntu/DEB-GPG-KEY-NVIDIA-HPC-SDK \
            | gpg --dearmor -o /usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg] https://developer.download.nvidia.com/hpc-sdk/ubuntu/amd64 /" \
            > /etc/apt/sources.list.d/nvhpc.list
          apt-get -y update
          apt-get install -y --no-install-recommends nvhpc-${NVHPC_VERSION/./-}
          apt-get clean
          echo "/opt/nvidia/hpc_sdk/Linux_x86_64/${NVHPC_VERSION}/compilers/bin" >> $GITHUB_PATH

      - name: Show compiler versions
        run: |
          nvc --version
          nvc++ --version
          nvcc --version

      - name: Checkout DOLFINx
        uses: actions/checkout@v7
        with:
          path: dolfinx-src

      - name: Load FEniCS testing environment variables
        run: cat dolfinx-src/.github/workflows/fenicsx-refs.env >> $GITHUB_ENV

      - name: Build and install Basix (C++) with nvc++
        run: |
          git clone --depth 1 --branch ${{ env.basix_ref }} https://github.com/${{ env.basix_repository }}.git basix-src
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Developer -DCMAKE_INSTALL_PREFIX=/opt/basix \
            -B build-basix -S basix-src/cpp
          cmake --build build-basix
          cmake --install build-basix

      # The Basix Python wrapper is built with gcc against the nvc++
      # Basix library, so only one libbasix is loaded. mpi4py and the
      # other Python build dependencies are also built with gcc.
      - name: Install FEniCS Python components
        env:
          CC: gcc
          CXX: g++
        run: |
          python3 -m venv /venv
          . /venv/bin/activate
          pip install --upgrade pip
          pip install --group dolfinx-src/python/pyproject.toml:build numpy cffi setuptools pytest-xdist
          pip install git+https://github.com/${{ env.ufl_repository }}.git@${{ env.ufl_ref }}
          pip install --no-build-isolation ./basix-src/python
          pip install --no-build-isolation git+https://github.com/${{ env.ffcx_repository }}.git@${{ env.ffcx_ref }}
          echo "/venv/bin" >> $GITHUB_PATH

      # DOLFINX_BASIX_PYTHON=OFF: find Basix in /opt/basix, not via the
      # Python package. No -g, to shorten the nvc++ build. CUDA uses the
      # toolkit bundled with the HPC SDK.
      - name: Configure and build DOLFINx (C++) with nvc++
        run: |
          cmake -Werror=dev --warn-uninitialized -G Ninja -DCMAKE_BUILD_TYPE=Developer -DBUILD_TESTING=true \
            -DDOLFINX_BASIX_PYTHON=OFF -DDOLFINX_DEVELOPER_DEBUG_INFO=OFF -DDOLFINX_ENABLE_CUDA=ON \
            -DDOLFINX_ENABLE_PETSC=false -DDOLFINX_ENABLE_SCOTCH=true -DDOLFINX_ENABLE_PARMETIS=false \
            -B build -S dolfinx-src/cpp/
          # -k 0: report every file nvc++ rejects, not only the first
          cmake --build build -- -k 0

      - name: Run C++ unit tests (serial and MPI np=2)
        working-directory: build
        run: |
          ctest -V --output-on-failure -R unittests_np_1
          ctest -V --output-on-failure -R unittests_np_2

      - name: Install DOLFINx (C++)
        run: cmake --install build

      - name: Build and run C++ demos (serial and MPI np=2)
        run: |
          cmake -Werror=dev --warn-uninitialized -G Ninja -DCMAKE_BUILD_TYPE=Developer \
            -DDOLFINX_DEVELOPER_DEBUG_INFO=OFF -B build/demo/ -S dolfinx-src/cpp/demo/
          cmake --build build/demo
          cd build/demo
          ctest -V --output-on-failure -R "demo_.*_np_1"
          ctest -V --output-on-failure -R "demo_.*_np_2"

      # nanobind rejects nvc++ (nb_platform.h: no __GXX_ABI_VERSION), so
      # the wrappers are built with gcc against the nvc++ libdolfinx.
      - name: Build Python interface (wrappers with gcc)
        env:
          CC: gcc
          CXX: g++
        run: >
          pip install --group dolfinx-src/python/pyproject.toml:test dolfinx-src/python/
          --check-build-dependencies --no-build-isolation
          --config-settings=cmake.build-type=Developer
          --config-settings=cmake.args=-DDOLFINX_DEVELOPER_DEBUG_INFO=OFF

      - name: Check Python configuration
        run: python -c "from mpi4py import MPI; import dolfinx; assert not dolfinx.has_petsc"

      - name: Set default DOLFINx JIT options
        run: |
          mkdir -p ~/.config/dolfinx
          echo '{ "cffi_extra_compile_args": ["-g0", "-O0" ] }' > ~/.config/dolfinx/dolfinx_jit_options.json

      # JIT-compiled kernels use gcc, as in the other jobs.
      - name: Run Python unit tests (serial and MPI np=2)
        env:
          CC: gcc
          CXX: g++
        run: |
          python -m pytest -n auto -m "not petsc4py and not adios2" --durations=50 dolfinx-src/python/test/unit/
          mpirun -np 2 python -m pytest -m "not petsc4py and not adios2" dolfinx-src/python/test/unit/
