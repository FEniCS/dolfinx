name: CI (Windows)

on:
  push:
    branches:
      - main
      - release
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stress_iterations:
        description: Repeats of the HDF5/XDMF test subset (0 to skip)
        default: "50"

# Cancel superseded runs: a new commit on a pull request makes the
# previous run's result irrelevant. Pushes to 'main' and 'release' are
# left to finish, since they populate caches and publish artefacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  windows-build:
    name: Windows vcpkg build (HDF5 ${{ matrix.hdf5 }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        hdf5: ["default", "2.1.1"]
    permissions:
      packages: write
    env:
      PYTHONFAULTHANDLER: "1"
      USERNAME: FEniCS
      VCPKG_EXE: C:/vcpkg/vcpkg
      FEED_URL: https://nuget.pkg.github.com/FEniCS/index.json
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/FEniCS/index.json,readwrite"

    # A non-zero exit from a native command (cmake, pip, mpiexec, ...)
    # does not by itself stop a pwsh `run:` step or fail it, unlike
    # bash's `set -e`; set both preferences once here, for every step,
    # rather than repeating them in each `run:` block.
    defaults:
      run:
        shell: pwsh -Command "$ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"

    steps:
      - name: Add NuGet sources
        run: |
          .$(${{ env.VCPKG_EXE }} fetch nuget) `
            sources add `
            -Source "${{ env.FEED_URL }}" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ env.USERNAME }}" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
          .$(${{ env.VCPKG_EXE }} fetch nuget) `
            setapikey "${{ secrets.GITHUB_TOKEN }}" `
            -Source "${{ env.FEED_URL }}"

      - name: Checkout DOLFINx
        uses: actions/checkout@v7
        with:
          path: dolfinx-src

      - name: Use HDF5 2.1.1 overlay port
        if: matrix.hdf5 == '2.1.1'
        run: |
          echo "VCPKG_OVERLAY_PORTS=$((Resolve-Path dolfinx-src/cpp/cmake/vcpkg-overlay-hdf5-2.1.1).Path)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      # Ninja avoids vcpkg resolving debug libraries into a Release build.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Load environment variables
        run: |
          cat dolfinx-src/.github/workflows/fenicsx-refs.env >> $env:GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Checkout UFL
        uses: actions/checkout@v7
        with:
          repository: "fenics/ufl"
          path: ufl
          ref: ${{ env.ufl_ref }}

      - name: Install UFL
        working-directory: ufl
        run: pip install .

      - name: Checkout Basix
        uses: actions/checkout@v7
        with:
          repository: "fenics/basix"
          path: basix
          ref: ${{ env.basix_ref }}

      # The basix overlay port builds this checkout directly, since
      # dolfinx CI tracks Basix's current branch tip rather than a
      # pinned release.
      - name: Point vcpkg's basix port at the checked-out source
        run: |
          $basixCommit = (git -C basix rev-parse --short HEAD).Trim()
          echo "BASIX_SOURCE_DIR=$((Resolve-Path basix/cpp).Path)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          # VCPKG_KEEP_ENV_VARS allowlists BASIX_SOURCE_DIR into vcpkg's scrubbed build environment.
          echo "VCPKG_KEEP_ENV_VARS=BASIX_SOURCE_DIR" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          $vcpkgJsonPath = "dolfinx-src/cpp/cmake/vcpkg-overlay/basix/vcpkg.json"
          # Folds the commit into the version so vcpkg's cache can't reuse a build from a different commit.
          (Get-Content $vcpkgJsonPath).Replace('0.0.0-local', "0.0.0-$basixCommit") | Set-Content $vcpkgJsonPath
          Get-Content $vcpkgJsonPath

      # basix.dll now comes from vcpkg's install tree, not a standalone prefix.
      - name: Insert add_dll_directory calls into Basix
        working-directory: basix/python/basix
        run: |
          (Get-Content __init__.py).Replace('# WINDOWSDLL', 'import os; os.add_dll_directory("D:/a/dolfinx/dolfinx/dolfinx-src/cpp/build-dir/vcpkg_installed/x64-windows/bin")') | Set-Content __init__.py
          Get-Content __init__.py

      - name: Checkout FFCx
        uses: actions/checkout@v7
        with:
          repository: "fenics/ffcx"
          path: ffcx
          ref: ${{ env.ffcx_ref }}

      - name: Install UFCx header
        working-directory: ffcx
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build-dir -S cmake/
          cmake --build build-dir --config Release
          cmake --install build-dir --config Release --prefix D:/a/dolfinx/ufcx-install

      - uses: mpi4py/setup-mpi@v1.4.4
        with:
          mpi: "intelmpi"

      # Split from the build step below because FFCx and Basix Python
      # need to exist before cpp/test compiles FFCx-generated forms.
      # basix is a manifest feature so build-wheels.yml can share this
      # vcpkg.json without triggering the overlay port.
      - name: Configure DOLFINx (C++)
        working-directory: dolfinx-src/cpp
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DDOLFINX_BUILD_DEMOS=ON -DINSTALL_RUNTIME_DEPENDENCIES=ON -DDOLFINX_BASIX_PYTHON=OFF -DDOLFINX_UFCX_PYTHON=OFF -Dufcx_DIR="D:/a/dolfinx/ufcx-install/share/ufcx/cmake" -DDOLFINX_ENABLE_SCOTCH=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_OVERLAY_PORTS="cmake/vcpkg-overlay" -DVCPKG_MANIFEST_FEATURES=basix-from-source -B build-dir -S .

      - name: Report installed HDF5
        working-directory: dolfinx-src/cpp/build-dir/vcpkg_installed
        run: |
          Get-ChildItem -Recurse -Filter "hdf5_*.list" | Select-Object -ExpandProperty Name

      - name: Install Basix Python build dependencies
        run: |
          python -m pip install scikit-build-core[pyproject] setuptools wheel nanobind
      - name: Install Basix (Python)
        working-directory: basix/python
        run: |
          python -m pip -v install --check-build-dependencies --no-build-isolation --no-cache-dir .[ci] --config-settings=cmake.args=-DBasix_DIR="D:/a/dolfinx/dolfinx/dolfinx-src/cpp/build-dir/vcpkg_installed/x64-windows/share/basix" --config-settings=cmake.build-type="Release"

      - name: Install FFCx
        working-directory: ffcx
        run: |
          pip install .

      - name: Insert add_dll_directory calls into DOLFINx
        working-directory: dolfinx-src/python/dolfinx
        run: |
          (Get-Content __init__.py).Replace('# WINDOWSDLL', 'import os; os.add_dll_directory("D:/a/dolfinx/dolfinx-install/bin"); os.add_dll_directory("C:/Program Files (x86)/Intel/oneAPI/mpi/latest/opt/mpi/libfabric/bin")') | Set-Content __init__.py
          Get-Content __init__.py

      - name: Build and install DOLFINx (C++)
        working-directory: dolfinx-src/cpp
        run: |
          cmake --build build-dir --config Release
          cmake --install build-dir --config Release --prefix D:/a/dolfinx/dolfinx-install
          echo "D:/a/dolfinx/dolfinx-install/bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Run C++ tests
        working-directory: dolfinx-src/cpp/build-dir
        run: |
          ctest --output-on-failure -C Release -R "^unittests_"
      - name: Run C++ demos
        working-directory: dolfinx-src/cpp/build-dir
        run: |
          ctest --output-on-failure -C Release -R "^demo_"

      - name: Install DOLFINx Python build dependencies
        working-directory: dolfinx-src/python
        run: |
          pip install --group pyproject.toml:build

      - name: Install DOLFINx (Python)
        working-directory: dolfinx-src/python
        run: |
          pip -v install --group pyproject.toml:test --check-build-dependencies --no-build-isolation . --config-settings=cmake.build-type="Release" --config-settings=cmake.args=-DBasix_DIR="D:/a/dolfinx/dolfinx/dolfinx-src/cpp/build-dir/vcpkg_installed/x64-windows/share/basix" --config-settings=cmake.args=-Dufcx_DIR="D:/a/dolfinx/ufcx-install/share/ufcx/cmake" --config-settings=cmake.args=-DDOLFINX_DIR="D:/a/dolfinx/dolfinx-install/lib/cmake/dolfinx" --config-settings=cmake.args=-DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" --config-settings=cmake.args=-DVCPKG_OVERLAY_PORTS="../cpp/cmake/vcpkg-overlay" --config-settings=cmake.args=-DVCPKG_MANIFEST_FEATURES=basix-from-source

      - name: Run tests (Python, serial)
        working-directory: dolfinx-src/python/test
        run: |
          # /Od is MSVC's -O0, disabling optimisation for JIT-compiled forms.
          '{ "cffi_extra_compile_args": ["/Od"] }' | Set-Content dolfinx_jit_options.json
          pip install pytest-xdist
          python -m pytest -n auto -m "not petsc4py and not adios2" unit/
      - name: Run tests (Python, MPI, np=3)
        working-directory: dolfinx-src/python/test
        run: |
          '{ "cffi_extra_compile_args": ["/Od"] }' | Set-Content dolfinx_jit_options.json
          mpiexec -l -n 3 python -m pytest -v -m "not petsc4py and not adios2" unit/

      - name: Repeat HDF5/XDMF tests (serial and MPI, np=3)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.stress_iterations != '0' }}
        working-directory: dolfinx-src/python/test
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          '{ "cffi_extra_compile_args": ["/Od"] }' | Set-Content dolfinx_jit_options.json
          $tests = @("unit/io", "unit/mesh/test_mesh_partitioners.py")
          $failed = 0
          foreach ($i in 1..[int]"${{ inputs.stress_iterations }}") {
            foreach ($mode in "serial", "mpi") {
              $log = "stress_${mode}_$i.log"
              if ($mode -eq "serial") {
                python -m pytest -n auto -m "not petsc4py and not adios2" @tests *> $log
              } else {
                mpiexec -l -n 3 python -m pytest -v -m "not petsc4py and not adios2" @tests *> $log
              }
              if ($LASTEXITCODE -ne 0) {
                $failed++
                "::group::FAILED $mode iteration $i (exit $LASTEXITCODE)"
                Get-Content $log -Tail 120
                "::endgroup::"
              }
            }
          }
          $total = 2 * [int]"${{ inputs.stress_iterations }}"
          "HDF5 ${{ matrix.hdf5 }}: $failed of $total runs failed" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($failed -gt 0) { exit 1 }

      - name: Repeat VTKHDF tests (xdist and no xdist)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.stress_iterations != '0' }}
        working-directory: dolfinx-src/python/test
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $summary = @()
          foreach ($mode in "xdist", "no-xdist") {
            $failed = 0
            foreach ($i in 1..[int]"${{ inputs.stress_iterations }}") {
              $log = "vtkhdf_${mode}_$i.log"
              if ($mode -eq "xdist") {
                python -m pytest -n 4 unit/io/test_vtkhdf.py *> $log
              } else {
                python -m pytest -p no:xdist unit/io/test_vtkhdf.py *> $log
              }
              if ($LASTEXITCODE -ne 0) {
                $failed++
                "::group::FAILED vtkhdf $mode iteration $i (exit $LASTEXITCODE)"
                Get-Content $log -Tail 80
                "::endgroup::"
              }
            }
            $summary += "HDF5 ${{ matrix.hdf5 }} vtkhdf ${mode}: $failed of ${{ inputs.stress_iterations }} runs failed"
          }
          $summary | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($summary -match ": [1-9]\d* of") { exit 1 }

      - name: Install demo dependencies (excluding numba)
        run: |
          pip install gmsh networkx matplotlib scipy pyvista

      - uses: pyvista/setup-headless-display-action@v5.1.0

      - name: Run Python demos, skip demo_comm-pattern (serial)
        working-directory: dolfinx-src/python/demo
        run: |
          python3 -m pytest -n auto -m serial -k "not demo_comm-pattern" --durations=10 test.py
      - name: Run Python demos, skip demo_comm-pattern (MPI, np=3)
        working-directory: dolfinx-src/python/demo
        run: |
          python3 -m pytest -m mpi -k "not demo_comm-pattern" --num-proc=3 test.py

      - name: Report native crash events
        if: failure()
        run: |
          Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            ProviderName = 'Application Error', 'Windows Error Reporting'
            StartTime = (Get-Date).AddHours(-4)
          } -ErrorAction SilentlyContinue |
            Select-Object -First 30 |
            ForEach-Object { "$($_.TimeCreated) $($_.ProviderName)"; $_.Message; "" }
