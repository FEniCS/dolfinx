# NOTE: The DOLFINx Python interface must be built without build
# isolation (PEP517) due to its runtime and build time dependency on
# system built petsc4py and mpi4py.
# NOTE: petsc4py is an optional build dependency, therefore we don't
# list it here.
[build-system]
# scikit-build-core>=0.11 has SPDX license support PEP 639.
# scikit-build-core>=1.0.0: editable installs need its PathFinder-based
# module resolution, required for nanobind-stubgen `import dolfinx.cpp`.
# nanobind>=2.9.2 has working recursive stubgen.
requires = ["scikit-build-core>=1.0.0", "nanobind>=2.9.2", "mpi4py"]
build-backend = "scikit_build_core.build"

[project]
name = "fenics-dolfinx"
version = "0.12.0.dev0"
description = "DOLFINx Python interface"
readme = "../README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
license-files = ["COPYING*"]
authors = [
      { email = "fenics-steering-council@googlegroups.com" },
      { name = "FEniCS Steering Council" },
]
dependencies = [
      "numpy>=2",
      "cffi",
      "mpi4py",
      "fenics-basix>=0.12.0.dev0",
      "fenics-ffcx>=0.12.0.dev0",
      "fenics-ufl>=2026.2.0.dev0",
]

[project.optional-dependencies]
# llvmlite (numba) is not built for x86_64 on macOS or arm64 on Windows - advanced users can install manually.
demo = [
      "gmsh",
      "networkx",
      "numba; (sys_platform != 'darwin' or platform_machine != 'x86_64') and (sys_platform != 'win32' or platform_machine != 'ARM64')",
      "matplotlib",
      "scipy",
      "pyvista",
]
optional = [
      "numba; (sys_platform != 'darwin' or platform_machine != 'x86_64') and (sys_platform != 'win32' or platform_machine != 'ARM64')",
]
petsc4py = ["petsc4py"]
typing = ["types-cffi", "types-setuptools", "scipy-stubs"]

[dependency-groups]
# Keep in sync with [build-system].requires above (petsc4py is an
# optional build dependency and is intentionally excluded).
build = ["scikit-build-core>=1.0.0", "nanobind>=2.9.2", "mpi4py"]
test = [
      "matplotlib",
      "networkx",
      "packaging",
      "pytest>=9.0.0",
      "scipy",
      "fenics-dolfinx[optional]",
]
docs = [
      "breathe",
      "jupytext",
      "markdown",
      "myst_parser",
      "packaging",
      "pyyaml",
      "sphinx",
      "pydata-sphinx-theme",
      "sphinx_codeautolink[ipython]",
      "sphinxcontrib-bibtex",
      "fenics-dolfinx[demo]",
]
lint = ["ruff", "gersemi", "clang-format"]
ci = [
      "pytest-xdist",
      "pyrefly",
      { include-group = "build" },
      { include-group = "docs" },
      { include-group = "lint" },
      { include-group = "test" },
      "fenics-dolfinx[optional]",
      "fenics-dolfinx[typing]",
]

[tool.scikit-build]
wheel.packages = ["dolfinx"]
wheel.exclude = ["*.cpp"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
# Set to FALSE to disable automatic RPATH adjustments
DOLFINX_INSTALL_RPATH_USE_LINK_PATH = "TRUE"

[tool.pyrefly]
project-includes = ["dolfinx", "demo", "test"]
baseline = "pyrefly-baseline.json"
infer-return-types = "annotated"
replace-imports-with-any = [
      "basix._basixcpp",
      "gmsh",
      "llvmlite",
      "llvmlite.*",
      "pyamg",
      "slepc4py",
      "slepc4py.*",
      "networkx",
      "pyvista",
      "pyvista.*",
      "pyvistaqt",
      "cffi",
      "cffi.*",
      "_cffi_backend",
]
ignore-missing-imports = ["ufl", "ufl.*", "ffcx", "ffcx.*", "scipy.*", "_cffi_kernelA"]

[[tool.pyrefly.sub-config]]
matches = "test/**"
check-unannotated-defs = false

[tool.pyrefly.sub-config.errors]
unbound-name = "ignore"

[tool.pytest]
junit_family = "xunit2"
markers = [
      "skip_in_parallel: marks tests that should be run in serial only.",
      "petsc4py: tests that require PETSc/petsc4py (deselect with '-m \"not petsc4py\"').",
      "adios2: tests that require Adios2 (deselect with '-m \"not adios2\"').",
      "xfail_win32_complex: expected failures for complex numbers in Win32.",
]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
      "D",      # pydocstyle
      "E",      # pycodestyle
      "W",      # pycodestyle
      "F",      # pyflakes
      "I",      # isort - use standalone isort
      "RUF",    # Ruff-specific rules
      "UP",     # pyupgrade
      "ICN",    # flake8-import-conventions
      "NPY",    # numpy-specific rules
      "FLY",    # use f-string not static joins
      "NPY201", # numpy 2.x ruleset
      "B905",   # zip-without-explicit-strict
      "TID251", # banned-api: dolfinx.cpp outside the wrapping layer
]
ignore = ["RUF012"]
allowed-confusables = ["σ", "ρ"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dolfinx.cpp".msg = """\
Use the pure Python dolfinx API, not the nanobind-wrapped dolfinx.cpp \
module, which is for internal use by the dolfinx package itself.\
"""

[tool.ruff.lint.isort]
known-first-party = ["basix", "dolfinx", "ffcx", "ufl"]
known-third-party = ["gmsh", "numba", "numpy", "pytest", "pyvista"]
section-order = [
      "future",
      "standard-library",
      "mpi",
      "third-party",
      "first-party",
      "local-folder",
]

[tool.ruff.lint.isort.sections]
"mpi" = ["mpi4py", "petsc4py"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"demo*.py" = ["D100"] # undocumented-public-module
"test*.py" = [
      "D100",
      "D103", # undocumented-public-function
      "D205", # missing-blank-line-after-summary
]
# cpp/doc/source/conf.py reads dolfinx.cpp.__version__ for the C++ docs version.
"conf.py" = ["D100", "D103", "D205", "TID251"]

# dolfinx.cpp is the nanobind wrapping layer itself.
"dolfinx/**/*.py" = ["TID251"]

# Mixed-topology mesh construction has no pure-Python API yet.
"test/unit/conftest.py" = ["D100", "D103", "D205", "TID251"]
"test/unit/mesh/test_mixed_topology.py" = ["TID251"]
"test/unit/mesh/test_create_mixed_mesh.py" = ["TID251"]
"test/unit/fem/test_mixed_mesh_dofmap.py" = ["TID251"]
"test/unit/io/test_vtkhdf.py" = ["TID251"]
"demo_mixed-topology.py" = ["TID251"]

# Deliberately compares the C++ and Python package versions.
"test/unit/common/test_version.py" = ["TID251"]
