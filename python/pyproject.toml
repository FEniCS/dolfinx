# NOTE: The DOLFINx Python interface must be built without build
# isolation (PEP517) due to its runtime and build time dependency on
# system built petsc4py and mpi4py.
# NOTE: petsc4py is an optional build dependency, therefore we don't
# list it here.
[build-system]
# scikit-build-core>=0.11 has SPDX license support PEP 639
# scikit-build-core>=1.0.0: editable installs need its PathFinder-based
# module resolution. Older versions' editable redirect always fails to
# import dolfinx.cpp, since the nanobind-generated dolfinx/cpp/*.pyi stub
# directory sits alongside the compiled dolfinx/cpp.<ext> module and
# confuses their file-vs-package classifier.
# nanobind>=2.9.2 has working recursive stubgen
requires = ["scikit-build-core>=1.0.0", "nanobind>=2.9.2", "mpi4py"]
build-backend = "scikit_build_core.build"

[project]
name = "fenics-dolfinx"
version = "0.12.0.dev0"
description = "DOLFINx Python interface"
readme = "../README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
license-files = ["COPYING*"]
authors = [
      { email = "fenics-steering-council@googlegroups.com" },
      { name = "FEniCS Steering Council" },
]
dependencies = [
      "numpy>=2",
      "cffi<2.1",
      "mpi4py",
      "fenics-basix>=0.12.0.dev0",
      "fenics-ffcx>=0.12.0.dev0",
      "fenics-ufl>=2026.2.0.dev0",
]

[project.optional-dependencies]
# llvmlite (numba) is not built for x86_64 on macOS or arm64 on Windows - advanced users can install manually.
demo = [
  "gmsh",
  "networkx",
  "numba; (sys_platform != 'darwin' or platform_machine != 'x86_64') and (sys_platform != 'win32' or platform_machine != 'ARM64')",
  "matplotlib",
  "scipy",
  "pyvista",
]
docs = [
      "breathe",
      "jupytext",
      "markdown",
      "myst_parser",
      "packaging",
      "pyyaml",
      "sphinx",
      "pydata-sphinx-theme",
      "sphinx_codeautolink[ipython]",
      "sphinxcontrib-bibtex",
      "fenics-dolfinx[demo]",
]
lint = ["ruff", "gersemi"]
mypy = ["mypy", "types-cffi", "types-setuptools", "scipy-stubs"]
optional = ["numba; (sys_platform != 'darwin' or platform_machine != 'x86_64') and (sys_platform != 'win32' or platform_machine != 'ARM64')"]
petsc4py = ["petsc4py"]
test = [
      "matplotlib",
      "networkx",
      "packaging",
      "pytest>=9.0.0",
      "scipy",
      "fenics-dolfinx[optional]",
]
ci = [
      "pytest-xdist",
      "fenics-dolfinx[build]",
      "fenics-dolfinx[docs]",
      "fenics-dolfinx[lint]",
      "fenics-dolfinx[mypy]",
      "fenics-dolfinx[optional]",
      "fenics-dolfinx[test]",
]

[tool.scikit-build]
wheel.packages = ["dolfinx"]
sdist.exclude = ["*.cpp"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
# Set to FALSE to disable automatic RPATH adjustments
DOLFINX_INSTALL_RPATH_USE_LINK_PATH = "TRUE"

[tool.pytest]
junit_family = "xunit2"
markers = [
      "skip_in_parallel: marks tests that should be run in serial only.",
      "petsc4py: tests that require PETSc/petsc4py (deselect with '-m \"not petsc4py\"').",
      "adios2: tests that require Adios2 (deselect with '-m \"not adios2\"').",
      "xfail_win32_complex: expected failures for complex numbers in Win32.",
]

[tool.mypy]
# Suggested at https://blog.wolt.com/engineering/2021/09/30/professional-grade-mypy-configuration/
disallow_untyped_defs = false
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = false

# Test bodies are unannotated pytest functions exercising loose numpy/dtype
# patterns; check_untyped_defs and no_implicit_optional are not enforced
# there.
[[tool.mypy.overrides]]
module = ["conftest", "unit.*"]
no_implicit_optional = false
check_untyped_defs = false

# Sister FEniCS projects (ufl, ffcx) ship no py.typed/stubs; gmsh, llvmlite,
# pyamg, slepc4py, pyvistaqt are untyped optional dependencies; _cffi_kernelA
# is a JIT-generated CFFI extension module name that can never be resolved
# statically. basix, petsc4py and dolfinx.cpp are typed/resolvable when
# actually built (e.g. local dev), but the lightweight CI lint job installs
# neither a matching-version basix wheel, a from-source petsc4py build, nor
# the native dolfinx.cpp extension, so they fall back to unresolved there.
[[tool.mypy.overrides]]
module = [
      "ufl",
      "ufl.*",
      "ffcx",
      "ffcx.*",
      "gmsh",
      "llvmlite",
      "llvmlite.*",
      "pyamg",
      "slepc4py",
      "slepc4py.*",
      "pyvistaqt",
      "basix",
      "basix.*",
      "petsc4py",
      "petsc4py.*",
      "dolfinx.cpp",
      "dolfinx.cpp.*",
]
ignore_missing_imports = true

# These modules expose ufl types (Form, Mesh, FunctionSpace, ...) in their
# public API annotations; disallow_any_unimported is unsatisfiable here while
# ufl/ffcx ship no py.typed/stubs. dolfinx.la annotates a PETSc.Vec-typed
# attribute guarded by `if TYPE_CHECKING`, which is unresolvable in builds
# without petsc4py installed.
[[tool.mypy.overrides]]
module = [
      "dolfinx.fem.function",
      "dolfinx.fem.forms",
      "dolfinx.fem.petsc",
      "dolfinx.fem.problems",
      "dolfinx.io.gmsh",
      "dolfinx.la",
      "dolfinx.mesh",
      "demo_gmsh",
      "demo_hdg",
      "demo_matrix-free-petsc",
      "demo_pml",
      "demo_scattering-boundary-conditions",
]
disallow_any_unimported = false

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
      "D",      # pydocstyle
      "E",      # pycodestyle
      "W",      # pycodestyle
      "F",      # pyflakes
      "I",      # isort - use standalone isort
      "RUF",    # Ruff-specific rules
      "UP",     # pyupgrade
      "ICN",    # flake8-import-conventions
      "NPY",    # numpy-specific rules
      "FLY",    # use f-string not static joins
      "NPY201", # numpy 2.x ruleset
      "B905",   # zip-without-explicit-strict
]
ignore = ["RUF012"]
allowed-confusables = ["σ", "ρ"]

[tool.ruff.lint.isort]
known-first-party = ["basix", "dolfinx", "ffcx", "ufl"]
known-third-party = ["gmsh", "numba", "numpy", "pytest", "pyvista"]
section-order = [
      "future",
      "standard-library",
      "mpi",
      "third-party",
      "first-party",
      "local-folder",
]

[tool.ruff.lint.isort.sections]
"mpi" = ["mpi4py", "petsc4py"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"demo*.py" = ["D100"] # undocumented-public-module
"test*.py" = [
    "D100",
    "D103",  # undocumented-public-function
    "D205"  # missing-blank-line-after-summary
]
"conf.py" = ["D100", "D103", "D205"]
